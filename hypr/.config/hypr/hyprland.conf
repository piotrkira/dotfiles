monitor = , preferred, auto, 1

$terminal = alacritty
$menu = bemenu-run

exec-once = waybar
exec-once = kanshi
exec-once = hypridle
exec-once = hyprpaper

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = rgba(a7c080ff)
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = master
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
      enabled = false
    }

    blur {
        enabled = false
        size = 3
        passes = 1
    }
}

animations {
    enabled = false
}

master {
    new_status = master
}

misc {
    enable_swallow = false
    swallow_regex = Alacritty
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}


device {
  name = at-translated-set-2-keyboard
  kb_options = caps:swapescape
}

input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = true
        scroll_factor = 0.8
    }
}


binds {
    movefocus_cycles_fullscreen = true
}

$mainMod = SUPER
$subMod = SUPER_SHIFT

bind = $subMod, c, killactive,
bind = $subMod, q, exit,
bind = $mainMod, space, togglefloating,
bind = $mainMod, d, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, v, togglesplit,
bind = $mainMod, f, fullscreen, 1
bind = $subMod, f, fullscreen
bind = $subMod, s, exec, grim -g "$(slurp -d)" - | wl-copy -t image/png; exec wl-paste > "$HOME/media/ss/ss$(date +%Y%m%d%H%M_%3N).png"

bind = $mainMod, return, layoutmsg, swapwithmaster

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $subMod, h, swapwindow, l
bind = $subMod, l, swapwindow, r
bind = $subMod, k, swapwindow, u
bind = $subMod, j, swapwindow, d

bind = $mainMod, r, submap, resize
submap = resize
bind = , h, resizeactive, -100 0
bind = , j, resizeactive, 0 100
bind = , k, resizeactive, 0 -100
bind = , l, resizeactive, 100 0
bind = , catchall, submap, reset
submap = reset

bind = $mainMod, o, submap, opensubmap
submap = opensubmap
bind = , t, exec, alacritty
bind = , t, submap, reset
bind = , b, exec, firefox
bind = , b, submap, reset
bind = , v, exec, watch-in-mpv.sh
bind = , v, submap, reset
bind = , catchall, submap, reset
submap = reset

bind = $mainMod, s, submap, system
submap = system
bind = , s, exec, shutdown now
bind = , r, exec, reboot
bind = , catchall, submap, reset
submap = reset

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $subMod, 1, movetoworkspacesilent, 1
bind = $subMod, 2, movetoworkspacesilent, 2
bind = $subMod, 3, movetoworkspacesilent, 3
bind = $subMod, 4, movetoworkspacesilent, 4
bind = $subMod, 5, movetoworkspacesilent, 5
bind = $subMod, 6, movetoworkspacesilent, 6
bind = $subMod, 7, movetoworkspacesilent, 7
bind = $subMod, 8, movetoworkspacesilent, 8
bind = $subMod, 9, movetoworkspacesilent, 9
bind = $subMod, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, light -A 10
bindel = ,XF86MonBrightnessDown, exec, ligth -U 10

bind = $mainMod, comma, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mainMod, period, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = $mainMod, M , exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrulev2 = suppressevent maximize, class:.*
workspace = w[1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
