$font = "Hack"

general {
  hide_cursor = true
  no_fade_in = true
  no_fade_out = true
}

background {
  monitor =
  path = ~/.bg
  blur_passes = 3
}

animations:enabled = false

input-field {
    monitor =
    size = 450, 50
    outline_thickness = 3
    inner_color = rgba(2b3339ff)

    outer_color = rgba(a7c080ff)
    check_color = rgba(dbbc7fff)
    fail_color = rgba(e67e80ff)

    font_color = rgba(d3c6aaff)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text =
    fail_text = $PAMFAIL
    hide_input = false
    hide_input_base_color = rgba(7fbbb3ff)

    dots_spacing = 0.2
    dots_size = 0.3

    position = 0, -25
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 50
    font_family = $font
    color = rgba(d3c6aaff)
    text_align = center

    position = 0, 50
    halign = center
    valign = center
}
